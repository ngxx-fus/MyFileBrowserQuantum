server:
  minSearchLength: 0
  disableUpdateCheck: false
  numImageProcessors: 4
  disablePreviews: false
  disablePreviewResize: false
  disableTypeDetectionByHeader: false
  logging:
    - levels: "info|warning|error"
      apiLevels: ""
      output: "stdout"
      noColors: false
      json: false
      utc: false
      apiFilter: ""
  database:
    path: "./filebrowser.sqlite"
  sources:
    - path: "/home/fus/"
      name: "ssd_fus"
      config:
        defaultEnabled: true
        defaultPermissions:
          view: true
          download: true
    - path: "/mnt/ExternalDisk"
      name: "fus_hdd"
      config:
        defaultEnabled: true
        defaultPermissions:
          view: true
          download: true
  cacheDir: "tmp"
  cacheDirCleanup: false
  maxArchiveSize: 20
  filesystem:
    createFilePermission: "644"
    createDirectoryPermission: "755"
  indexSqlConfig:
    batchSize: 1000
    cacheSizeMB: 32
    walMode: false
    disableReuse: false
    startupIntegrityCheck: "quickCheck"

auth:
  tokenExpirationHours: 2
  adminUsername: "admin"
  # adminPassword: "admin"
  methods:
    password:
      enabled: true
      minLength: 5
      signup: false
      recaptcha:
        host: ""
        key: ""
        secret: ""
      enforcedOtp: false
    proxy:
      enabled: false
      adminGroup: ""
      userGroups: []
      groupsClaim: ""
      userIdentifier: ""
      disableVerifyTLS: false
      logoutRedirectUrl: ""
      createUser: false
      header: ""
    oidc:
      enabled: false
      adminGroup: ""
      userGroups: []
      groupsClaim: ""
      userIdentifier: ""
      disableVerifyTLS: false
      logoutRedirectUrl: ""
      createUser: false
      clientId: ""
      clientSecret: ""
      issuerUrl: ""
      scopes: ""
    ldap:
      enabled: false
      adminGroup: ""
      userGroups: []
      groupsClaim: ""
      userIdentifier: ""
      disableVerifyTLS: false
      logoutRedirectUrl: ""
      createUser: false
      server: ""
      baseDN: ""
      userDN: ""
      userPassword: ""
      userFilter: ""
    jwt:
      enabled: false
      adminGroup: ""
      userGroups: []
      groupsClaim: ""
      userIdentifier: ""
      disableVerifyTLS: false
      logoutRedirectUrl: ""
      createUser: false
      header: ""
      secret: ""
      algorithm: ""
    passkey:
      enabled: false
      rpDisplayName: ""
      rpId: ""
      rpOrigins: []
      loginButtonText: ""
    noauth: false
  key: ""
  totpSecret: ""

frontend:
  name: "FileBrowser Quantum"
  disableDefaultLinks: false
  disableUsedPercentage: false
  externalLinks: []
  disableNavButtons: false
  styling:
    disableEventThemes: false
    customCSS: ""
    lightBackground: ""
    darkBackground: ""
    customThemes: {}
  favicon: ""
  description: ""
  loginIcon: ""
  loginButtonText: ""
  oidcLoginButtonText: ""
  disablePWAInstall: false

userDefaults:
  sidebar:
    disableQuickToggles: false
    hideFileActions: false
    disableHideOnPreview: false
    sticky: true
    hideFiles: false
    showTools: true
  listing:
    deleteWithoutConfirming: false
    dateFormat: false
    showHidden: false
    quickDownload: false
    showSelectMultiple: false
    singleClick: false
    hideFileExt: ""
    showCopyPath: false
    deleteAfterArchive: true
    viewMode: "normal"
    gallerySize: 3
  preview:
    image: true
    video: true
    audio: true
    motionVideoPreview: true
    office: true
    popup: true
    disablePreviewExt: ""
    highQuality: true
    folder: true
    models: true
  fileViewer:
    autoplayMedia: true
    disableViewingExt: ""
    disableOnlyOfficeExt: ".md .txt .pdf .html .xml"
    preferEditorForMarkdown: false
    debugOffice: false
  search:
    disableOptions: false
  ui:
    darkMode: true
    themeColor: "var(--blue)"
    customTheme: ""
    locale: "en"
  fileLoading:
    maxConcurrentUpload: 10
    uploadChunkSizeMb: 10
    clearAll: false
    downloadChunkSizeMb: 0
  account:
    permissions:
      api: false
      admin: false
      share: false
      realtime: false
    lockPassword: false
    disableSettings: false
    disableUpdateNotifications: false

integrations:
  office:
    url: ""
    internalUrl: ""
    secret: ""
    viewOnly: false
  media:
    ffmpegPath: ""
    convert:
      imagePreview:
        heic: false
        jpeg: true
      videoPreview:
        3g2: true
        3gp: true
        asf: true
        avi: true
        f4v: true
        flv: true
        m2ts: true
        m4v: true
        mkv: true
        mov: true
        mp4: true
        mpeg: true
        mpg: true
        ogv: true
        ts: true
        vob: true
        webm: true
        wmv: true
    debug: false
    extractEmbeddedSubtitles: false
    hardwareAcceleration: false

http:
  port: 3676
  listen: ""
  socket: ""
  tlsCert: "/etc/letsencrypt/live/ngxxfus.io.vn/fullchain.pem"
  tlsKey: "/etc/letsencrypt/live/ngxxfus.io.vn/privkey.pem"
  baseURL: ""
  externalUrl: ""
  internalUrl: ""
  disableWebDAV: false
  trustProxyHeaders: true
  disableRateLimit: false
